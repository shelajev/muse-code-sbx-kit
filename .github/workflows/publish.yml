name: Publish kit to Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  KIT_REPOSITORY: docker.io/olegselajev241/muse-code-sbx-kit

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install sbx
        run: |
          curl -fsSL https://get.docker.com | sudo REPO_ONLY=1 sh
          sudo apt-get update
          sudo apt-get install -y docker-sbx

      - name: Validate kit
        run: sbx kit validate .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: olegselajev241
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish latest
        run: ./scripts/push.sh "$KIT_REPOSITORY:latest"
