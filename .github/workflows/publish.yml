name: Publish kit to Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  KIT_REPOSITORY: docker.io/olegselajev241/muse-code-sbx-kit

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install sbx
        run: |
          curl -fsSL https://get.docker.com | sudo REPO_ONLY=1 sh
          sudo apt-get update
          sudo apt-get install -y docker-sbx

      - name: Validate kit
        run: sbx kit validate .

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: olegselajev241
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish latest and V2
        run: |
          ./scripts/push.sh "$KIT_REPOSITORY:latest"
          ./scripts/push.sh "$KIT_REPOSITORY:v2"
