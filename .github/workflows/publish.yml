name: Publish kit to Docker Hub

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish (for example, 0.1.0)
        required: true
        type: string

permissions:
  contents: read

env:
  KIT_REPOSITORY: docker.io/shelajev/muse-code-sbx-kit

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install sbx
        run: |
          curl -fsSL https://get.docker.com | sudo REPO_ONLY=1 sh
          sudo apt-get update
          sudo apt-get install -y docker-sbx

      - name: Validate kit
        run: sbx kit validate .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: shelajev
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${DISPATCH_VERSION#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sbx kit push . "$KIT_REPOSITORY:$VERSION"

      - name: Publish latest
        run: sbx kit push . "$KIT_REPOSITORY:latest"
